groups:
  # ============================================================================
  # 1. Application LogQL Log Anomaly Alerts
  # ============================================================================
  - name: application_log_alerts
    rules:
      - alert: HighSeverityLogSpike
        expr: sum(rate({namespace="monitoring"} |= "ERROR" [5m])) by (service_name) > 10
        for: 2m
        labels:
          severity: warning
          tier: logs
        annotations:
          summary: "High volume of ERROR logs on {{ $labels.service_name }}"
          description: "Service {{ $labels.service_name }} is emitting > 10 ERROR logs/sec over 5 minutes."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts?var-service={{ $labels.service_name }}"

      - alert: JavaOutOfMemoryErrorLogged
        expr: count_over_time({service_name="spring-boot-app"} |= "java.lang.OutOfMemoryError" [5m]) > 0
        for: 0m
        labels:
          severity: critical
          tier: runtime
        annotations:
          summary: "JVM OutOfMemoryError detected in log stream"
          description: "Application {{ $labels.service_name }} logged a fatal java.lang.OutOfMemoryError."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts?var-service=spring-boot-app"

      - alert: UnhandledExceptionSpike
        expr: sum(rate({service_name="spring-boot-app"} |= "Exception" [5m])) > 5
        for: 3m
        labels:
          severity: warning
          tier: application
        annotations:
          summary: "High rate of unhandled exceptions logged"
          description: "Spring Boot app is logging > 5 exceptions/sec over the last 5 minutes."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts?var-service=spring-boot-app"

  # ============================================================================
  # 2. Loki Internal Component Health Alerts
  # ============================================================================
  - name: loki_infrastructure_alerts
    rules:
      - alert: LokiRequestErrors
        expr: 100 * sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(loki_request_duration_seconds_count[5m])) > 10
        for: 5m
        labels:
          severity: critical
          tier: logging
        annotations:
          summary: "Loki High Request Error Rate"
          description: "Loki has > 10% 5xx server errors over the last 5 minutes."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts"

      - alert: LokiIngesterUnhealthy
        expr: max by (namespace) (loki_ring_members{state="Unhealthy", name="ingester"}) > 0
        for: 5m
        labels:
          severity: critical
          tier: logging
        annotations:
          summary: "Loki Ingester Unhealthy"
          description: "There are unhealthy Loki ingester(s) in namespace {{ $labels.namespace }}."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts"

      - alert: LokiDistributorUnhealthy
        expr: max by (namespace) (loki_ring_members{state="Unhealthy", name="distributor"}) > 0
        for: 5m
        labels:
          severity: warning
          tier: logging
        annotations:
          summary: "Loki Distributor Unhealthy"
          description: "There are unhealthy Loki distributor(s) in namespace {{ $labels.namespace }}."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts"

      - alert: LokiCompactorUnhealthy
        expr: sum by (namespace) (increase(loki_compactor_runs_failed_total[1h])) > 2
        for: 15m
        labels:
          severity: critical
          tier: logging
        annotations:
          summary: "Loki Compactor Unhealthy"
          description: "More than 2 Loki compaction runs failed in the past hour in namespace {{ $labels.namespace }}."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts"

      - alert: LokiPanics
        expr: sum by (namespace) (increase(loki_panic_total[10m])) > 0
        for: 0m
        labels:
          severity: critical
          tier: logging
        annotations:
          summary: "Loki Instance Panic"
          description: "Loki process in namespace {{ $labels.namespace }} encountered a panic."
          runbook_url: "http://localhost:3000/d/service-health/service-health-and-alerts"
