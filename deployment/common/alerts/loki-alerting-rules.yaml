groups:
  - name: loki_alerts
    rules:
      - alert: LokiRequestErrors
        expr: 100 * sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) / sum(rate(loki_request_duration_seconds_count[5m])) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Loki High Request Error Rate"
          description: "Loki has > 10% 5xx server errors over the last 5 minutes."

      - alert: LokiIngesterUnhealthy
        expr: max by (namespace) (loki_ring_members{state="Unhealthy", name="ingester"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Loki Ingester Unhealthy"
          description: "There are unhealthy Loki ingester(s) in namespace {{ $labels.namespace }}."

      - alert: LokiDistributorUnhealthy
        expr: max by (namespace) (loki_ring_members{state="Unhealthy", name="distributor"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki Distributor Unhealthy"
          description: "There are unhealthy Loki distributor(s) in namespace {{ $labels.namespace }}."

      - alert: LokiCompactorUnhealthy
        expr: sum by (namespace) (increase(loki_compactor_runs_failed_total[1h])) > 2
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Loki Compactor Unhealthy"
          description: "More than 2 Loki compaction runs failed in the past hour in namespace {{ $labels.namespace }}."

      - alert: LokiPanics
        expr: sum by (namespace) (increase(loki_panic_total[10m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Loki Instance Panic"
          description: "Loki process in namespace {{ $labels.namespace }} encountered a panic."
