# Redpanda Dev Configuration (Lightweight single-node for local dev - Chart 26.2.1)

# 1. Container Image Configuration
image:
  repository: redpandadata/redpanda

# 2. StatefulSet & Controller Sidecars
statefulset:
  replicas: 1
  sideCars:
    image:
      repository: redpandadata/redpanda-operator

# 3. Resource Allocation & Limits
resources:
  cpu:
    cores: 100m
  memory:
    container:
      max: 2Gi
    redpanda:
      memory: 1536M
      reserveMemory: 200M

# 4. Storage & Persistence
storage:
  persistentVolume:
    enabled: false

# 5. Security & Connectivity
tls:
  enabled: false

external:
  enabled: false

# 6. Redpanda Console UI
console:
  enabled: true
  image:
    registry: docker.io
    repository: redpandadata/console

# 7. Cluster & RPK Configuration
config:
  cluster:
    auto_create_topics_enabled: true
  rpk:
    enable_usage_stats: false

# 8. Logging & Telemetry (Disable phone-home usage stats)
logging:
  usageStats:
    enabled: false

# 9. Monitoring Integrations
monitoring:
  enabled: false

