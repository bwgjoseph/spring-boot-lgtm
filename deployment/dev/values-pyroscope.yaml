# Pyroscope Dev Configuration (Single-binary mode, filesystem storage)
# No MinIO required — uses local ephemeral storage to keep resource footprint minimal.

pyroscope:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

  persistence:
    enabled: false

  config: |
    storage:
      backend: filesystem
      filesystem:
        dir: /data

# Disable the bundled sub-chart MinIO — not needed for filesystem mode
minio:
  enabled: false
