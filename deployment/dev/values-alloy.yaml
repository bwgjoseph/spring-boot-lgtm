alloy:
  # Clustering disabled for dev/sandbox to save resources
  clustering:
    enabled: false
  
  # Expose essential ports for OTLP ingestion
  extraPorts:
    - name: "otlp-grpc"
      port: 4317
      targetPort: 4317
      protocol: TCP
  
  # Headless service for reliable discovery
  service:
    enabled: true
    clusterIP: None 
  
  # Path for WAL/Persistence
  storagePath: /var/lib/alloy/data 
  
  # Add hostPath volume mount for /var/log/pods to enable Alloy log tailing
  extraVolumes:
    - name: varlog
      hostPath:
        path: /var/log/pods
  extraVolumeMounts:
    - name: varlog
      mountPath: /var/log/pods
      readOnly: true
  
  configMap:
    create: true
    content: |-
      // --- SHARED DISCOVERY (The Radar + Firewall) ---
      discovery.kubernetes "all_pods" { role = "pod" }

      // --- LOGS: DISCOVERY & RELABELING ---
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.all_pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "^(?:;*)([^;]+).*$"
          replacement   = "$1"
          target_label  = "service_name"
        }
      }

      loki.source.kubernetes "logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.extract_metadata.receiver]
      }

      // Metadata Extraction: Promote trace_id and span_id to structured metadata
      loki.process "extract_metadata" {
        forward_to = [loki.write.local.receiver]

        stage.regex {
          // Matches format: [app,traceId,spanId,userId] allowing empty values
          expression = ".*\\[(?P<app>[^,]*),(?P<traceId>[^,]*),(?P<spanId>[^,]*),(?P<userId>[^,]*)\\].*"
        }

        stage.structured_metadata {
          values = {
            "trace_id" = "traceId",
            "span_id"  = "spanId",
            "user_id"  = "userId",
          }
        }

        // Drop internal capture groups to avoid label bloat
        stage.label_drop {
          values = ["app", "traceId", "spanId", "userId"]
        }
      }

      loki.write "local" {
        endpoint { url = "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push" }
      }

      // --- METRICS: PROMETHEUS SCRAPING (ANNOTATION BASED) ---
      
      // Filter pods to only those with 'prometheus.io/scrape: "true"' annotation
      discovery.relabel "spring_boot_pods" {
        targets = discovery.kubernetes.all_pods.targets
        
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          action = "keep"
          regex = "true"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          action = "replace"
          target_label = "__metrics_path__"
          regex = "(.+)"
        }
        
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          action = "replace"
          regex = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement = "$1:$2"
          target_label = "__address__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
          separator     = ";"
          regex         = "^(?:;*)([^;]+).*$"
          replacement   = "$1"
          target_label  = "service_name"
        }
      }

      prometheus.scrape "spring_boot" {
        targets    = discovery.relabel.spring_boot_pods.output
        forward_to = [prometheus.remote_write.prom.receiver]
      }

      prometheus.remote_write "prom" {
        endpoint {
          url = "http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write"
          send_exemplars = true
        }
      }

      // --- TRACES: OTLP INGESTION (DIRECT PATH FOR DEV) ---
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        output { traces = [otelcol.processor.k8sattributes.default.input] }
      }

      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = ["k8s.pod.name", "k8s.namespace.name", "k8s.node.name"]
        }
        output { traces = [otelcol.processor.batch.default.input] }
      }

      otelcol.processor.batch "default" {
        output { traces = [otelcol.exporter.otlp.tempo.input] }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }

controller:
  type: daemonset
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Minimal persistence for sandbox
persistence:
  enabled: true
  size: 5Gi
  accessModes: [ReadWriteOnce]
