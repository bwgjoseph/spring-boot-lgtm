tempo:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 10
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10

  extraArgs:
    mem-ballast-size-mbs: 16
    config.expand-env: "true"

  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword

# Manually define the config to ensure correct field names and structure
config: |
  server:
    http_listen_port: 3200
  storage:
    trace:
      backend: s3
      s3:
        endpoint: minio.monitoring.svc:9000
        bucket: tempo
        access_key: admin
        secret_key: ${S3_SECRET_KEY}
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  compactor:
    compaction:
      block_retention: 72h # 3 days
  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
  metrics_generator:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://prometheus-server.monitoring.svc/api/v1/write
    traces_storage:
      path: /var/tempo/traces
  overrides:
    metrics_generator_processors: [service-graphs, span-metrics, local-blocks]

persistence:
  enabled: true
  size: 10Gi
