deploymentMode: SingleBinary

# Disable memory-heavy caches — dev is resource-constrained
chunksCache:
  enabled: false

resultsCache:
  enabled: false

# 18.x: metric label changed from `cluster` to `app_instance`
monitoring:
  appInstanceLabelName: "app_instance"
  dashboards:
    enabled: true
    annotations:
      grafana_folder: "Loki"
    labels:
      grafana_dashboard: "1"
  rules:
    enabled: false

# Keep the gateway for standard routing
gateway:
  enabled: true

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  
  limits_config:
    retention_period: 72h # 3 days

  ingester:
    chunk_idle_period: 30s
    chunk_retain_period: 0s
    max_chunk_age: 1m
    flush_op_timeout: 10s
    flush_check_period: 10s

  storage:
    type: s3
    s3:
      endpoint: minio.monitoring.svc:9000
      access_key_id: admin
      secret_access_key: password123
      s3ForcePathStyle: true
      insecure: true
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Single Binary Resource Limits
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi