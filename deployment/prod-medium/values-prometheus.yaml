server:
  # Enable remote-write receiver for Tempo metrics generator (Service Graphs / Span Metrics)
  remoteWriteReceiver: true

  # Prometheus server command-line flags
  # Leave empty to let the chart manage mandatory flags and avoid duplicates
  extraArgs:
    web.enable-remote-write-receiver: ""
    # Enable exemplar storage in TSDB; without this Prometheus silently discards all received exemplars
    storage.tsdb.max-exemplars: "1000000"

  # Set retention period
  retention: "30d"

  persistentVolume:
    enabled: true
    size: 120Gi

  resources:
    requests:
      cpu: 1
      memory: 4Gi
    limits:
      memory: 8Gi


  # Prometheus configuration file contents
  config:
    rule_files:
      - /etc/config/rules/*.yaml
    alerting:
      alertmanagers:
        - kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              action: keep
              regex: monitoring
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: keep
              regex: alertmanager
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              action: keep
              regex: "9093"

extraVolumes:
  - name: extra-rules
    configMap:
      name: prometheus-alert-rules

extraVolumeMounts:
  - name: extra-rules
    mountPath: /etc/config/rules
    readOnly: true


# Enable/Disable components
alertmanager:
  enabled: true
  persistentVolume:
    enabled: true
    size: 10Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'service', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'null-receiver'
    receivers:
      - name: 'null-receiver'

prometheus-pushgateway:
  enabled: false

prometheus-node-exporter:
  enabled: true
  hostRootFsMount:
    enabled: false

kube-state-metrics:
  enabled: true
