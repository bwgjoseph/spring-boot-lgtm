# Redpanda Production Configuration (Chart 26.2.1)

# 1. Container Image Configuration
image:
  repository: redpandadata/redpanda

# 2. StatefulSet & Controller Sidecars
statefulset:
  replicas: 3
  sideCars:
    image:
      repository: redpandadata/redpanda-operator

# 3. Resource Allocation & Limits
# Seastar memory model: container max = Seastar memory (~80%) + reserve. 4Gi limit => ~3.2GiB engine memory.
resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 4Gi

# 4. Storage & Persistence
# 24h retention @ 3 MB/sec x 3x replication x 30% buffer = 350Gi per broker
storage:
  persistentVolume:
    enabled: true
    size: 350Gi


# 5. Security & Connectivity
tls:
  enabled: false

external:
  enabled: false

# 6. Redpanda Console UI
console:
  enabled: true
  image:
    registry: docker.io
    repository: redpandadata/console

# 7. Cluster & RPK Configuration
config:
  cluster:
    auto_create_topics_enabled: true
  rpk:
    enable_usage_stats: false

# 8. Logging & Telemetry (Disable phone-home usage stats)
logging:
  usageStats:
    enabled: false

# 9. Monitoring Integrations
monitoring:
  enabled: false

