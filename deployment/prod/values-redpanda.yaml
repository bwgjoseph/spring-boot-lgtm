# Redpanda Production Configuration (Chart 26.2.1)
image:
  repository: redpandadata/redpanda

statefulset:
  replicas: 3
  sideCars:
    image:
      repository: redpandadata/redpanda-operator

resources:
  cpu:
    cores: 500m
  memory:
    container:
      max: 2Gi

storage:
  persistentVolume:
    enabled: true
    size: 20Gi

tls:
  enabled: false

external:
  enabled: false

console:
  enabled: true
  image:
    registry: docker.io
    repository: redpandadata/console

config:
  cluster:
    auto_create_topics_enabled: true

monitoring:
  enabled: false
