server:
  # Enable remote-write receiver for Tempo metrics generator (Service Graphs / Span Metrics)
  remoteWriteReceiver: true
  extraArgs:
    web.enable-remote-write-receiver: ""

  persistentVolume:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  retention: "14d"
  config:
    rule_files:
      - /etc/config/alerting_rules.yml
    alerting:
      alertmanagers:
        - kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              action: keep
              regex: monitoring
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              action: keep
              regex: alertmanager
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              action: keep
              regex: "9093"

extraVolumes:
  - name: extra-rules
    configMap:
      name: prometheus-alert-rules

extraVolumeMounts:
  - name: extra-rules
    mountPath: /etc/config/alerting_rules.yml
    subPath: prometheus-alerting-rules.yaml
    readOnly: true

alertmanager:
  enabled: true
  persistentVolume:
    enabled: true
    size: 10Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'service', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'null-receiver'
    receivers:
      - name: 'null-receiver'
