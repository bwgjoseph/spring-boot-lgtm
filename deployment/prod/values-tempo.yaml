# Tempo Distributed (Chart v3.0.6, Tempo 3.x) - Production Configuration
fullnameOverride: tempo

streamOverHTTPEnabled: true
reportingEnabled: false

# 1. Redpanda Kafka Streaming Ingestion
ingest:
  kafka:
    address: redpanda.monitoring.svc.cluster.local:9092
    topic: tempo-traces
    auto_create_topic_enabled: true
    auto_create_topic_default_partitions: 3

# 2. Ingestion components connected to Kafka (3 replicas matching partition count)
blockBuilder:
  enabled: true
  replicas: 3
  extraArgs:
    - -config.expand-env=true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

liveStore:
  enabled: true
  replicas: 3
  extraArgs:
    - -config.expand-env=true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

# 3. Storage configuration for MinIO S3 backend
storage:
  trace:
    backend: s3
    blocklist_poll: 1m
    s3:
      endpoint: minio.monitoring.svc.cluster.local:9000
      bucket: tempo
      access_key: admin
      secret_key: ${S3_SECRET_KEY}
      insecure: true
      forcepathstyle: true

# Secret injection for S3 bucket credentials
globalExtraEnv:
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: minio
        key: rootPassword

# High-throughput production resource allocations & replicas
distributor:
  replicas: 2
  extraArgs:
    - -config.expand-env=true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

querier:
  replicas: 2
  extraArgs:
    - -config.expand-env=true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2
      memory: 4Gi

queryFrontend:
  replicas: 2
  extraArgs:
    - -config.expand-env=true

backendScheduler:
  extraArgs:
    - -config.expand-env=true

backendWorker:
  extraArgs:
    - -config.expand-env=true

# Metrics generator configuration
metricsGenerator:
  enabled: true
  extraArgs:
    - -config.expand-env=true
  config:
    storage:
      path: /var/tempo/generator/wal
      remote_write:
        - url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
          send_exemplars: true
  processor:
    service_graphs: {}
    span_metrics: {}
    local_blocks: {}

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]
      generate_native_histograms: both
