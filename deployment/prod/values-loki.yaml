# Loki Deployment Mode: SimpleScalable separates read/write/backend for independent scaling
deploymentMode: SimpleScalable

chunksCache:
  enabled: true
  memcached:
    replicas: 2

resultsCache:
  enabled: true
  memcached:
    replicas: 2

loki:
  auth_enabled: false

  # Disable usage statistics reporting
  analytics:
    reporting_enabled: false
  
  # HA configuration: 2 replicas provide a balance between HA and resource efficiency
  commonConfig:
    replication_factor: 2

  ingester:
    # Chunk settings
    chunk_idle_period: 30m
    chunk_target_size: 1572864  # 1.5 MB
    chunk_encoding: snappy
    max_chunk_age: 2h
    flush_op_timeout: 10s

  # Enable memberlist service for clustering/gossip protocol
  memberlist:
    service:
      enabled: true
      publishNotReadyAddresses: true
    join_members:
      - loki-memberlist

  # Secret injection for S3 bucket credentials
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword

  # Production Guardrails & Retention Policy
  limits_config:
    # Rate limits
    ingestion_rate_strategy: global
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB
    
    # Stream limits
    max_global_streams_per_user: 10000
    max_streams_per_user: 0
    
    # Validation
    max_line_size: 256KB
    max_line_size_truncate: false
    max_label_name_length: 1024
    max_label_value_length: 2048
    max_label_names_per_series: 15
    tsdb_max_query_parallelism: 128
    
    # Time constraints
    reject_old_samples: true
    reject_old_samples_max_age: 168h # 7 days
    creation_grace_period: 10m
    unordered_writes: true
    retention_period: 720h # 30 days
  
  # Enable Physical Retention Enforcement on S3 via Compactor
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: s3

  # Storage backend configuration using S3-compatible object storage
  storage:
    type: s3
    s3:
      endpoint: minio.monitoring.svc.cluster.local:9000
      access_key_id: admin
      secret_access_key: ${S3_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki

  # Schema configuration using v13 (TSDB) for efficient indexing
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

# Write path: Ingester guardrails for production
write:
  replicas: 2
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword
  resources:
    limits:
      cpu: 1
      memory: 2Gi

# Read path: Querier guardrails for production
read:
  replicas: 2
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword
  resources:
    limits:
      cpu: 2
      memory: 4Gi

# Backend path: Relies on chart defaults for background processing
backend:
  replicas: 2
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword

# Gateway: Nginx ingress for external/internal traffic routing
gateway:
  enabled: true
  replicas: 2
