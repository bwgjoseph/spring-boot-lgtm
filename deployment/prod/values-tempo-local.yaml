# Optimized for local verification of Scalable Monolithic mode
replicas: 2

# Disable anti-affinity for single-node cluster
# The tempo chart (v2.0.0) doesn't have a high-level affinity toggle in the same way as Loki.
affinity: {}

tempo:
  repository: grafana/tempo
  tag: 2.10.1
  
  # Resource limits for the pod
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extraArgs:
    config.expand-env: "true"

  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword

# Manually define the config to ensure correct field names and structure
# This IS at the top level in version 2.0.0
config: |
  server:
    http_listen_port: 3200
  storage:
    trace:
      backend: s3
      s3:
        endpoint: minio.monitoring.svc:9000
        bucket: tempo
        access_key: admin
        secret_key: ${S3_SECRET_KEY}
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  compactor:
    compaction:
      block_retention: 72h
  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: inmemory
        replication_factor: 1
    max_block_duration: 1m
  metrics_generator:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://prometheus-server.monitoring.svc/api/v1/write
    traces_storage:
      path: /var/tempo/traces
  overrides:
    metrics_generator_processors: [service-graphs, span-metrics, local-blocks]

persistence:
  enabled: true
  size: 5Gi
