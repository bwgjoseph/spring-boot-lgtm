# Phase 3: Clustered Alloy Verification
# Converts Alloy from DaemonSet to Deployment (Clustered)

alloy:
  clustering:
    enabled: true
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // --- INGESTION ---
      otelcol.receiver.otlp "default" {
        http {}
        grpc {}
        output {
          traces  = [otelcol.exporter.otlp.tempo.input]
          logs    = [otelcol.exporter.loki.default.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc:4317"
          tls { insecure = true }
        }
      }

      otelcol.exporter.loki "default" {
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        }
      }

      prometheus.remote_write "prom" {
        endpoint {
          url = "http://prometheus-server.monitoring.svc/api/v1/write"
        }
      }

  # Clustering port (Gossip)
  extraPorts:
    - name: "cluster"
      port: 7946
      targetPort: 7946
      protocol: TCP
    - name: "otlp-http"
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: "otlp-grpc"
      port: 4317
      targetPort: 4317
      protocol: TCP

# Deployment mode with 2 replicas for HA verification
controller:
  type: deployment
  replicas: 2
