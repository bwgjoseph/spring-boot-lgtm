# MinIO Production Configuration: Standalone mode with SSD persistence
mode: standalone
replicas: 1

# Credential management using existing Kubernetes Secret for security
existingSecret: minio-secret

# Persistence: High-performance SSD volume for object storage durability
persistence:
  enabled: true
  size: 50Gi
  # storageClass: "ssd" # Ensure SSD/NVMe storage class is used

# Create buckets on startup for LGTM stack
buckets:
  - name: loki
    policy: public
  - name: tempo
    policy: public
  - name: mimir
    policy: public

# Resource allocations sized for high-volume S3 metadata caching
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

# Service configuration
service:
  type: ClusterIP
  port: 9000

# Console configuration
consoleService:
  type: ClusterIP
  port: 9001
