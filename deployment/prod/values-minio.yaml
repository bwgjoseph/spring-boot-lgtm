# MinIO Production Configuration: Distributed mode with SSD persistence
# 4 nodes x 250Gi = 1TB raw — covers 600GB Loki (90d) + 200GB Tempo (14d) + 30% buffer
mode: distributed
replicas: 4

# Credential management using existing Kubernetes Secret for security
existingSecret: minio-secret

# Persistence: High-performance SSD volume for object storage durability
persistence:
  enabled: true
  size: 250Gi
  # storageClass: "ssd" # Ensure SSD/NVMe storage class is used

# Create buckets on startup for LGTM stack
buckets:
  - name: loki
    policy: public
  - name: tempo
    policy: public
  - name: mimir
    policy: public

# Resource allocations sized for small-scale S3 metadata caching
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 2Gi

# Service configuration
service:
  type: ClusterIP
  port: 9000

# Console configuration
consoleService:
  type: ClusterIP
  port: 9001
