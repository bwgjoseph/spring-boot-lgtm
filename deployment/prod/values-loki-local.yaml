deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 2
  
  limits_config:
    retention_period: 720h # 30 days

  storage:
    type: s3
    s3:
      endpoint: minio.monitoring.svc:9000
      access_key_id: admin
      # Injected via environment variable from 'minio' secret
      secret_access_key: ${S3_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h

# Disable memory-heavy caches for local verification
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Optimized for local verification of distributed architecture
write:
  replicas: 2
  affinity:
    podAntiAffinity: null
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

read:
  replicas: 2
  affinity:
    podAntiAffinity: null
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicas: 2
  affinity:
    podAntiAffinity: null
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
