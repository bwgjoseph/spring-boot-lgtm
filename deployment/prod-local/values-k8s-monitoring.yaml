cluster:
  name: k8s-prod-local

destinations:
  prometheus:
    type: prometheus
    url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
    metrics:
      sendExemplars: true

  loki:
    type: loki
    url: http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push

  tempo:
    type: otlp
    protocol: grpc
    url: http://tempo-distributor.monitoring.svc.cluster.local:4317
    tls:
      insecure: true
    traces:
      enabled: true
    metrics:
      enabled: false
    logs:
      enabled: false

# Feature Exclusions to conserve resources
beyla:
  enabled: false
costMetrics:
  enabled: false
kepler:
  enabled: false
prometheusOperatorObjects:
  enabled: false

# Telemetry Services (managed scrapers)
telemetryServices:
  node-exporter:
    deploy: true
  kube-state-metrics:
    deploy: true

# Telemetry Features
annotationAutodiscovery:
  enabled: true
  collector: alloy-metrics

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true

clusterEvents:
  enabled: true
  collector: alloy-logs

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

applicationObservability:
  enabled: true
  collectors: [alloy-receiver]
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317

podLogs:
  extraLogProcessingStages: |-
    stage.regex {
      expression = ".*\\[(?P<app>[^,]*),(?P<traceId>[^,]*),(?P<spanId>[^,]*),(?P<userId>[^,]*)\\].*"
    }
    stage.structured_metadata {
      values = {
        "trace_id" = "traceId",
        "span_id"  = "spanId",
        "user_id"  = "userId",
      }
    }
    stage.label_drop {
      values = ["app", "traceId", "spanId", "userId"]
    }

grafanaDashboards:
  enabled: true
  labelKey: grafana_dashboard
  labelValue: "1"
  namespace: monitoring

# Multi-Role Architecture for Prod-Local HA
collectors:
  alloy-metrics:
    enabled: true
    alloy:
      clustering:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  alloy-logs:
    enabled: true
    presets:
      logs:
        enabled: true
    alloy:
      clustering:
        enabled: true
      mounts:
        varlog: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  alloy-receiver:
    enabled: true
    alloy:
      clustering:
        enabled: true
      extraPorts:
        - name: "otlp-grpc"
          port: 4317
          targetPort: 4317
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

  alloy-singleton:
    enabled: false
