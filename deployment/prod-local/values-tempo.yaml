# Tempo Deployment: Scalable Monolithic (Single Binary) with 2 replicas for HA
replicas: 2

tempo:
  # Configuration expansion to support environment variables in values
  extraArgs:
    config.expand-env: "true"

  # Secret injection for S3 bucket credentials
  extraEnv:
    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio
          key: rootPassword

  # Resource allocations sized for high-throughput ingestion and metrics generation
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  # Termination grace period for reliable WAL flushing to S3
  terminationGracePeriodSeconds: 60

# Core Tempo server and storage configuration
config: |
  server:
    http_listen_port: 3200
    grpc_server_max_recv_msg_size: 16777216
  storage:
    trace:
      backend: s3
      s3:
        endpoint: minio.monitoring.svc.cluster.local:9000
        bucket: tempo
        access_key: admin
        secret_key: ${S3_SECRET_KEY}
        insecure: true
        forcepathstyle: true
      wal:
        path: /var/tempo/wal
  compactor:
    compaction:
      block_retention: 168h # 7 days
  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
  ingester:
    lifecycler:
      ring:
        kvstore:
          store: memberlist # Transition to memberlist for HA resilience
        replication_factor: 2

  metrics_generator:
    storage:
      path: /var/tempo/wal
      remote_write:
        - url: http://prometheus-server.monitoring.svc.cluster.local:80/api/v1/write
    traces_storage:
      path: /var/tempo/traces
    processor:
      service_graphs: {}
      span_metrics: {}
      local_blocks: {}

# Persistence: High-IOPS SSD volume for WAL durability
persistence:
  enabled: true
  size: 5Gi
